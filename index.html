<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block City v0.5</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0a; --card: #151515; --card2: #1d1d1d; --border: #2a2a2a;
    --green: #4ade80; --green-dark: #14532d; --red: #ef4444; --red-dark: #3f1d1d;
    --purple: #a855f7; --yellow: #facc15; --text: #e5e5e5; --muted: #888;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 10px; max-width: 900px; margin: 0 auto; padding-bottom: 80px;
  }
  h1 { font-size: 17px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  h1 small { font-size: 11px; color: var(--muted); font-weight: normal; }
  .topbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px; }
  .stat { background: var(--card); padding: 6px 4px; border-radius: 8px; font-size: 11px; border: 1px solid var(--border); text-align: center; }
  .stat b { display: block; color: var(--green); font-size: 13px; margin-top: 2px; }
  
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
  .tab { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; white-space: nowrap; }
  .tab.active { background: var(--green); color: #000; border-color: var(--green); }

  .view { display: none; }
  .view.active { display: block; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--green); }

  /* ФИЛЬТРЫ */
  .filters { display: flex; gap: 4px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 4px; }
  .f-btn { background: var(--card2); border: 1px solid var(--border); color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; white-space: nowrap; }
  .f-btn.active { background: var(--green-dark); border-color: var(--green); color: var(--green); }

  .item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; gap: 8px; }
  .item:last-child { border: none; }
  .item-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .item-info small { color: var(--muted); font-size: 10px; display: block; }
  
  button { background: var(--green); color: #000; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; transition: .15s; }
  button:active { transform: scale(.96); }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  button.danger { background: var(--red); color: #fff; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }

  /* КАРТА */
  #map { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin: 8px 0; }
  .cell { aspect-ratio: 1; background: var(--card2); border: 1px solid var(--border); border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; text-align: center; padding: 1px; transition: .15s; }
  .cell.mine { background: var(--green-dark); border-color: var(--green); }
  .cell.taken { background: var(--red-dark); border-color: var(--red); }
  .cell .shop { font-weight: bold; font-size: 7px; color: #ccc; margin-top: 1px; }
  .cell .price { color: var(--yellow); font-size: 8px; }
  .cell svg { width: 50%; height: 50%; }

  /* МАГАЗИН */
  .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card2); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
  .shop-header h2 { margin: 0; font-size: 15px; color: var(--yellow); }
  .shop-layout { display: flex; flex-direction: column; gap: 10px; }
  
  .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .slot { background: #111; border: 2px dashed #333; border-radius: 8px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: .2s; padding: 4px; text-align: center; position: relative; }
  .slot.filled { border-style: solid; border-color: var(--green); background: var(--card2); }
  .slot.filled:hover { border-color: var(--yellow); }
  .slot svg { width: 40%; height: 40%; margin-bottom: 4px; }
  .slot .name { font-size: 9px; font-weight: bold; line-height: 1.1; }
  .slot .price-tag { font-size: 9px; color: var(--yellow); background: #000; padding: 1px 4px; border-radius: 4px; margin-top: 2px; }
  .slot .remove { position: absolute; top: 2px; right: 2px; background: var(--red); color: white; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; }

  .customer-zone { min-height: 80px; background: #111; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; padding: 10px; }
  .customer-bubble { background: var(--card); border: 1px solid var(--purple); padding: 8px 12px; border-radius: 20px; font-size: 11px; animation: popIn .3s; display: flex; align-items: center; gap: 8px; max-width: 100%; text-align: left; }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .customer-bubble svg { width: 24px; height: 24px; flex-shrink: 0; }

  .empty { color: #666; font-size: 12px; padding: 8px; text-align: center; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .rarity { font-size: 8px; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
  .r-common { background: #333; color: #aaa; }
  .r-rare { background: #1e3a8a; color: #93c5fd; }
  .r-epic { background: #4c1d95; color: #c4b5fd; }
  .r-legend { background: #854d0e; color: #fde047; }

  /* МОДАЛЬНОЕ ОКНО ВЫБОРА */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content { background: var(--card); width: 100%; max-width: 400px; max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); }
  .modal-header { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { margin: 0; font-size: 14px; color: var(--green); }
  .modal-body { padding: 10px; overflow-y: auto; flex: 1; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--green); color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 12px; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,.6); max-width: 90%; text-align: center; animation: toastIn .2s; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }
  .toast.err { border-color: var(--red); }
</style>
</head>
<body>

<h1>🏪 Block City <small>v0.5 (Ассортимент)</small></h1>

<div class="topbar">
  <div class="stat">💰<b id="cash">2000</b></div>
  <div class="stat">⭐<b id="rep">1</b></div>
  <div class="stat">🏪<b id="blocks">0</b></div>
  <div class="stat">📦<b id="invCount">0</b></div>
  <div class="stat">📅<b id="day">1</b></div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="map">🗺️ Карта</button>
  <button class="tab" data-tab="market">🛒 Рынок</button>
  <button class="tab" data-tab="inv">📦 Склад</button>
  <button class="tab" data-tab="log">📜 Лог</button>
</div>

<!-- КАРТА -->
<div class="view active" id="view-map">
  <div class="panel">
    <h2>Карта района (8×8)</h2>
    <div id="map"></div>
    <div class="hint">Нажми на свой 🟩 блок, чтобы зайти в магазин.</div>
  </div>
</div>

<!-- МАГАЗИН -->
<div class="view" id="view-shop">
  <button class="ghost" onclick="switchTab('map')" style="margin-bottom:10px">← Назад на карту</button>
  
  <div class="shop-header">
    <div>
      <h2 id="shopTitle">Магазин</h2>
      <div style="font-size:11px;color:var(--muted)">Кликни на слот, чтобы выставить товар</div>
    </div>
    <button onclick="renameShop()" style="padding:6px 8px;font-size:10px">✏️ Имя</button>
  </div>

  <div class="shop-layout">
    <div class="panel">
      <h2>👀 Витрина</h2>
      <div class="shelf" id="shelf"></div>
    </div>

    <div class="panel">
      <h2>🚶 Покупатели</h2>
      <div class="customer-zone" id="customerZone">
        <div class="empty">Ждем покупателей...</div>
      </div>
    </div>
  </div>
</div>

<!-- РЫНОК -->
<div class="view" id="view-market">
  <div class="panel">
    <h2>🛒 Оптовый рынок (Закупка)</h2>
    <div class="filters" id="marketFilters"></div>
    <div id="market"></div>
  </div>
</div>

<!-- СКЛАД -->
<div class="view" id="view-inv">
  <div class="panel">
    <h2>📦 Мой склад</h2>
    <div class="filters" id="invFilters"></div>
    <div id="inventory"></div>
  </div>
</div>

<!-- ЛОГ -->
<div class="view" id="view-log">
  <div class="panel">
    <h2>📜 Лог событий</h2>
    <div id="log" style="font-size:11px;color:#aaa;max-height:300px;overflow-y:auto;white-space:pre-line;background:#0a0a0a;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:monospace;"></div>
  </div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="selectModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Выбери товар на витрину</h3>
      <button class="danger" onclick="closeModal()" style="padding:4px 8px">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const SIZE = 8;
const SAVE_KEY = 'blockcity_save_v5';

// ===== SVG =====
const SVG = {
  blockFree: `<svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="6" fill="#1d1d1d" stroke="#333" stroke-width="2"/><path d="M14 20h12M20 14v12" stroke="#555" stroke-width="2" stroke-linecap="round"/></svg>`,
  blockMine: `<svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2"/><path d="M12 26V16l8-5 8 5v10" fill="none" stroke="#4ade80" stroke-width="2" stroke-linejoin="round"/><rect x="17" y="21" width="6" height="8" fill="#4ade80"/></svg>`,
  blockTaken: `<svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="6" fill="#3f1d1d" stroke="#ef4444" stroke-width="2"/><path d="M14 14l12 12M26 14L14 26" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></svg>`,
  hoodie: `<svg viewBox="0 0 40 40"><path d="M12 8l8-4 8 4v6l4 4v14H8V18l4-4z" fill="#333" stroke="#888" stroke-width="1.5"/><path d="M16 8c0 4 8 4 8 0" fill="none" stroke="#888" stroke-width="1.5"/></svg>`,
  tee: `<svg viewBox="0 0 40 40"><path d="M12 10l8-4 8 4 4 6-4 2v14H12V18l-4-2z" fill="#333" stroke="#888" stroke-width="1.5"/></svg>`,
  jeans: `<svg viewBox="0 0 40 40"><path d="M12 8h16v12l-2 14h-5l-1-12-1 12h-5l-2-14z" fill="#333" stroke="#888" stroke-width="1.5"/></svg>`,
  sneaker: `<svg viewBox="0 0 40 40"><path d="M6 26v-6l8-2 6-6 8 2 6 6v6z" fill="#333" stroke="#888" stroke-width="1.5"/><path d="M6 26h28" stroke="#888" stroke-width="2"/></svg>`,
  cap: `<svg viewBox="0 0 40 40"><path d="M8 22c0-8 6-12 12-12s12 4 12 12H8z" fill="#333" stroke="#888" stroke-width="1.5"/><path d="M8 22h24" stroke="#888" stroke-width="2"/></svg>`,
  chain: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="none" stroke="#facc15" stroke-width="2"/><circle cx="20" cy="20" r="4" fill="#facc15"/></svg>`,
  rapper: `<svg viewBox="0 0 40 40"><circle cx="20" cy="14" r="7" fill="#a855f7"/><path d="M8 34c0-7 5-11 12-11s12 4 12 11" fill="#a855f7"/><path d="M13 12h14" stroke="#111" stroke-width="2"/></svg>`,
  civilian: `<svg viewBox="0 0 40 40"><circle cx="20" cy="14" r="7" fill="#4ade80"/><path d="M8 34c0-7 5-11 12-11s12 4 12 11" fill="#4ade80"/></svg>`
};
function catIcon(cat) {
  const m = { 'верх': 'hoodie', 'низ': 'jeans', 'обувь': 'sneaker', 'голова': 'cap', 'аксессуар': 'chain' };
  const s = SVG[m[cat] || 'hoodie'];
  return `<span style="display:inline-block;width:100%;height:100%">${s}</span>`;
}

// ===== ГЕНЕРАТОР ТОВАРОВ =====
const BRANDS = {
  'Nike': { tier: 1, rep: 1 }, 'Adidas': { tier: 1, rep: 1 }, 'Puma': { tier: 1, rep: 1 }, 'Vans': { tier: 1, rep: 1 }, 'Levi\'s': { tier: 1, rep: 1 },
  'Jordan': { tier: 2, rep: 2 }, 'New Balance': { tier: 2, rep: 2 }, 'Supreme': { tier: 2, rep: 2 }, 'Bape': { tier: 2, rep: 2 }, 'Armani': { tier: 2, rep: 2 },
  'Gucci': { tier: 3, rep: 3 }, 'Louis Vuitton': { tier: 3, rep: 3 }, 'Balenciaga': { tier: 3, rep: 3 }, 'Off-White': { tier: 3, rep: 3 }, 'Palm Angels': { tier: 3, rep: 3 },
  'Lanvin': { tier: 4, rep: 4 }, 'Chrome Hearts': { tier: 4, rep: 4 }, 'Moncler': { tier: 4, rep: 4 }, 'Rolex': { tier: 4, rep: 5 }, 'Rick Owens': { tier: 4, rep: 4 }
};

const CATEGORIES = {
  'верх': [
    { name: 'Худи', base: 120 }, { name: 'Свитшот', base: 100 }, { name: 'Футболка', base: 60 }, { name: 'Лонгслив', base: 70 },
    { name: 'Куртка', base: 200 }, { name: 'Пуховик', base: 300 }, { name: 'Ветровка', base: 150 }, { name: 'Рубашка', base: 90 }
  ],
  'низ': [
    { name: 'Джинсы', base: 90 }, { name: 'Джоггеры', base: 80 }, { name: 'Карго', base: 110 }, { name: 'Шорты', base: 50 }, { name: 'Спорт. штаны', base: 70 }
  ],
  'обувь': [
    { name: 'Кроссовки', base: 180 }, { name: 'Ботинки', base: 200 }, { name: 'Сандалии', base: 80 }, { name: 'Слипоны', base: 100 }, { name: 'Хайтопы', base: 220 }
  ],
  'голова': [
    { name: 'Шапка', base: 50 }, { name: 'Кепка', base: 60 }, { name: 'Бейсболка', base: 55 }, { name: 'Дюраг', base: 40 }, { name: 'Бандана', base: 45 }
  ],
  'аксессуар': [
    { name: 'Ремень', base: 80 }, { name: 'Цепь', base: 150 }, { name: 'Очки', base: 100 }, { name: 'Сумка', base: 180 }, { name: 'Рюкзак', base: 120 }, { name: 'Часы', base: 250 }, { name: 'Браслет', base: 60 }
  ]
};

// Генерируем около 70+ уникальных товаров
const PRODUCTS = [];
let pId = 0;
for (const [cat, items] of Object.entries(CATEGORIES)) {
  for (const item of items) {
    // Берем 3-4 случайных бренда для каждой категории
    const brandKeys = Object.keys(BRANDS);
    const shuffled = [...brandKeys].sort(() => 0.5 - Math.random());
    const selectedBrands = shuffled.slice(0, 4); 
    
    for (const brand of selectedBrands) {
      const bData = BRANDS[brand];
      const multiplier = bData.tier; // Чем выше тир, тем дороже
      
      const buy = Math.floor((item.base + (Math.random() * 20)) * multiplier);
      const sell = Math.floor(buy * (1.4 + Math.random() * 0.4)); // Наценка 40-80%
      
      let rarity = 'common';
      if (bData.tier === 2) rarity = 'rare';
      if (bData.tier === 3) rarity = 'epic';
      if (bData.tier === 4) rarity = 'legend';

      PRODUCTS.push({
        id: 'p' + (pId++),
        name: `${item.name} ${brand}`,
        brand: brand,
        cat: cat,
        buy: buy,
        sell: sell,
        rep: bData.rep,
        rarity: rarity
      });
    }
  }
}

// Рэперы
const RAPPERS = [
  { name: 'King Von', budget: 1500, likes: ['Nike', 'Jordan'], minRep: 1 },
  { name: 'Lil Loaded', budget: 2000, likes: ['Gucci', 'Louis Vuitton'], minRep: 2 },
  { name: 'Polo G', budget: 1200, likes: ['Nike', 'Adidas'], minRep: 1 },
  { name: 'NLE Choppa', budget: 2500, likes: ['Balenciaga', 'Off-White'], minRep: 2 },
  { name: 'Sleepy Hallow', budget: 1000, likes: ['Supreme', 'Nike'], minRep: 1 },
  { name: 'Lil Durk', budget: 3000, likes: ['Gucci', 'Lanvin', 'Chrome Hearts'], minRep: 3 },
  { name: 'Pop Smoke', budget: 4000, likes: ['Louis Vuitton', 'Balenciaga', 'Rolex'], minRep: 3 },
  { name: 'Sheff G', budget: 1100, likes: ['Bape', 'Nike'], minRep: 1 }
];

// ===== СОСТОЯНИЕ =====
const state = {
  cash: 3000, rep: 1, day: 1,
  map: Array.from({ length: SIZE }, () => Array(SIZE).fill(null)),
  inventory: [],
  myBlocks: [],
  activeShop: null,
  log: [],
  marketFilter: 'all',
  invFilter: 'all'
};

const $ = (id) => document.getElementById(id);

function toast(msg, isErr = false) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function logMsg(msg) {
  state.log.unshift(`[Д${state.day}] ${msg}`);
  if (state.log.length > 50) state.log.pop();
  $('log').textContent = state.log.join('\n');
}

function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch (e) {} }
}

function updateUI() {
  $('cash').textContent = state.cash;
  $('rep').textContent = state.rep;
  $('blocks').textContent = state.myBlocks.length;
  $('invCount').textContent = state.inventory.length;
  $('day').textContent = state.day;
  renderMap();
  renderFilters();
  renderMarket();
  renderInventory();
  if (state.activeShop) renderShopView();
  save();
}

// ===== ФИЛЬТРЫ =====
function renderFilters() {
  const cats = ['all', 'верх', 'низ', 'обувь', 'голова', 'аксессуар'];
  
  $('marketFilters').innerHTML = cats.map(c => 
    `<div class="f-btn ${state.marketFilter === c ? 'active' : ''}" onclick="setFilter('market', '${c}')">${c === 'all' ? 'Все' : c}</div>`
  ).join('');
  
  $('invFilters').innerHTML = cats.map(c => 
    `<div class="f-btn ${state.invFilter === c ? 'active' : ''}" onclick="setFilter('inv', '${c}')">${c === 'all' ? 'Все' : c}</div>`
  ).join('');
}

function setFilter(type, cat) {
  if (type === 'market') { state.marketFilter = cat; renderMarket(); }
  else { state.invFilter = cat; renderInventory(); }
  renderFilters();
}

// ===== КАРТА =====
function renderMap() {
  const el = $('map');
  el.innerHTML = '';
  for (let x = 0; x < SIZE; x++) {
    for (let y = 0; y < SIZE; y++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const b = state.map[x][y];
      if (b) {
        cell.classList.add(b.mine ? 'mine' : 'taken');
        cell.innerHTML = `${b.mine ? SVG.blockMine : SVG.blockTaken}<div class="shop">${b.shop}</div>`;
      } else {
        cell.innerHTML = `${SVG.blockFree}<div class="price">${x},${y}</div>`;
      }
      cell.onclick = () => clickCell(x, y);
      el.appendChild(cell);
    }
  }
}

function clickCell(x, y) {
  const b = state.map[x][y];
  if (b) {
    if (b.mine) {
      state.activeShop = { x, y };
      switchTab('shop');
    } else {
      toast('Блок занят конкурентом', true);
    }
    return;
  }
  if (state.cash < 500) { toast('Нужно 500 кэша', true); return; }
  state.cash -= 500;
  state.map[x][y] = { mine: true, shop: 'Мой магазин', shelves: [null, null, null, null, null, null] };
  state.myBlocks.push([x, y]);
  logMsg(`🏪 Куплен блок ${x},${y}`);
  state.activeShop = { x, y };
  updateUI();
  switchTab('shop');
}

// ===== МАГАЗИН =====
function renderShopView() {
  if (!state.activeShop) return;
  const b = state.map[state.activeShop.x][state.activeShop.y];
  if (!b) return;
  
  $('shopTitle').textContent = `🏬 ${b.shop}`;
  
  const shelfEl = $('shelf');
  shelfEl.innerHTML = '';
  b.shelves.forEach((item, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot' + (item ? ' filled' : '');
    
    if (item) {
      slot.innerHTML = `
        <div class="remove" onclick="event.stopPropagation(); removeFromShelf(${i})">✕</div>
        ${catIcon(item.cat)}
        <div class="name">${item.name.split(' ')[0]}</div>
        <div style="font-size:8px;color:#aaa">${item.brand}</div>
        <div class="price-tag">${item.price}</div>
      `;
      slot.onclick = () => removeFromShelf(i);
    } else {
      slot.innerHTML = `<div style="color:#555;font-size:20px">+</div><div style="font-size:9px;color:#555">Выбрать</div>`;
      slot.onclick = () => openSelectModal(i);
    }
    shelfEl.appendChild(slot);
  });
}

// Модалка выбора товара
function openSelectModal(slotIndex) {
  if (!state.inventory.length) { toast('Склад пуст!', true); return; }
  
  const modal = $('selectModal');
  const body = $('modalBody');
  
  body.innerHTML = state.inventory.map((item, idx) => {
    const markupPrice = Math.floor(item.sell * 1.2);
    return `
      <div class="item" style="cursor:pointer" onclick="selectItemForShelf(${idx}, ${slotIndex})">
        <div class="item-info">
          <span style="width:24px;height:24px">${catIcon(item.cat)}</span>
          <div>
            <div>${item.name}</div>
            <small>${item.brand} · Цена в магазине: <b style="color:var(--yellow)">${markupPrice}</b></small>
          </div>
        </div>
      </div>
    `;
  }).join('');
  
  modal.classList.add('active');
}

function closeModal() { $('selectModal').classList.remove('active'); }

function selectItemForShelf(invIndex, slotIndex) {
  const item = state.inventory.splice(invIndex, 1)[0];
  const markupPrice = Math.floor(item.sell * 1.2);
  
  const b = state.map[state.activeShop.x][state.activeShop.y];
  b.shelves[slotIndex] = { ...item, price: markupPrice };
  
  logMsg(`📦 Выставил ${item.name} за ${markupPrice}`);
  closeModal();
  updateUI();
}

function removeFromShelf(slotIndex) {
  const b = state.map[state.activeShop.x][state.activeShop.y];
  const item = b.shelves[slotIndex];
  if (!item) return;
  
  const original = PRODUCTS.find(p => p.id === item.id) || item;
  state.inventory.push({ ...original });
  b.shelves[slotIndex] = null;
  
  logMsg(`📦 Убрал ${item.name} с витрины`);
  updateUI();
}

function renameShop() {
  const b = state.map[state.activeShop.x][state.activeShop.y];
  const n = prompt('Новое название:', b.shop);
  if (n) { b.shop = n; updateUI(); }
}

// ===== РЫНОК =====
function renderMarket() {
  const el = $('market');
  el.innerHTML = '';
  
  const filtered = PRODUCTS.filter(p => state.marketFilter === 'all' || p.cat === state.marketFilter);
  
  if (!filtered.length) { el.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }

  filtered.forEach(p => {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <div class="item-info">
        <span style="width:24px;height:24px">${catIcon(p.cat)}</span>
        <div>
          <div>${p.name} <span class="rarity r-${p.rarity}">${p.rarity}</span></div>
          <small>${p.brand} · Закупка: ${p.buy}</small>
        </div>
      </div>
    `;
    const btn = document.createElement('button');
    btn.textContent = `Купить`;
    btn.disabled = state.cash < p.buy;
    btn.onclick = () => {
      state.cash -= p.buy;
      state.inventory.push({ ...p });
      logMsg(`🛍️ Куплен ${p.name} за ${p.buy}`);
      updateUI();
    };
    row.appendChild(btn);
    el.appendChild(row);
  });
}

// ===== СКЛАД =====
function renderInventory() {
  const el = $('inventory');
  el.innerHTML = '';
  
  const filtered = state.inventory.map((p, i) => ({ p, i })).filter(x => state.invFilter === 'all' || x.p.cat === state.invFilter);
  
  if (!filtered.length) {
    el.innerHTML = '<div class="empty">Склад пуст или нет вещей в этой категории.</div>';
    return;
  }
  
  filtered.forEach(({ p, i }) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <div class="item-info">
        <span style="width:24px;height:24px">${catIcon(p.cat)}</span>
        <div>
          <div>${p.name} <span class="rarity r-${p.rarity}">${p.rarity}</span></div>
          <small>${p.brand} · Продажа: ${p.sell}</small>
        </div>
      </div>
    `;
    el.appendChild(row);
  });
}

// ===== ЖИЗНЬ ГОРОДА (КЛИЕНТЫ) =====
function customerTick() {
  if (!state.myBlocks.length) return;
  
  const randomBlock = state.myBlocks[Math.floor(Math.random() * state.myBlocks.length)];
  const b = state.map[randomBlock[0]][randomBlock[1]];
  if (!b || !b.shelves) return;
  
  const itemsOnShelf = b.shelves.map((item, index) => ({ item, index })).filter(x => x.item !== null);
  if (itemsOnShelf.length === 0) return;

  const isRapper = Math.random() < 0.2 && state.rep >= 1;
  
  if (isRapper) {
    const r = RAPPERS[Math.floor(Math.random() * RAPPERS.length)];
    if (state.rep < r.minRep) return;
    
    const match = itemsOnShelf.find(x => r.likes.includes(x.item.brand));
    if (match) {
      const buyPrice = Math.floor(match.item.price * 1.5);
      state.cash += buyPrice;
      state.rep += 1;
      
      b.shelves[match.index] = null;
      
      logMsg(`🎤 ${r.name} зашел в «${b.shop}» и купил ${match.item.name} за ${buyPrice}! (+1 реп)`);
      toast(`🎤 ${r.name} купил ${match.item.name}!`);
      
      if (state.activeShop && state.activeShop.x === randomBlock[0] && state.activeShop.y === randomBlock[1]) {
        showCustomer(`🎤 ${r.name}`, `Купил ${match.item.name} за ${buyPrice}`, true);
      }
      updateUI();
      return;
    }
  } else {
    const match = itemsOnShelf[Math.floor(Math.random() * itemsOnShelf.length)];
    const buyPrice = match.item.price;
    
    state.cash += buyPrice;
    b.shelves[match.index] = null;
    
    logMsg(`🚶 Покупатель зашел в «${b.shop}» и купил ${match.item.name} за ${buyPrice}`);
    
    if (state.activeShop && state.activeShop.x === randomBlock[0] && state.activeShop.y === randomBlock[1]) {
      showCustomer(`🚶 Покупатель`, `Купил ${match.item.name} за ${buyPrice}`, false);
    }
    updateUI();
    return;
  }
}

function showCustomer(name, text, isRapper) {
  const zone = $('customerZone');
  if (!zone) return;
  zone.innerHTML = `
    <div class="customer-bubble" style="border-color: ${isRapper ? 'var(--purple)' : 'var(--green)'}">
      <span style="width:24px;height:24px">${isRapper ? SVG.rapper : SVG.civilian}</span>
      <div>
        <b>${name}</b><br>
        <span style="color:var(--muted)">${text}</span>
      </div>
    </div>
  `;
  setTimeout(() => {
    if (zone.innerHTML.includes(text)) zone.innerHTML = `<div class="empty">Ждем покупателей...</div>`;
  }, 4000);
}

// ===== ТАБЫ =====
function switchTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  
  if (tabId === 'shop' && !state.activeShop) tabId = 'map';
  
  const tabBtn = document.querySelector(`.tab[data-tab="${tabId}"]`);
  if (tabBtn) tabBtn.classList.add('active');
  else document.querySelector('.tab[data-tab="map"]').classList.add('active');
  
  $('view-' + tabId).classList.add('active');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => switchTab(tab.dataset.tab);
});

// ===== ИНИЦИАЛИЗАЦИЯ =====
function init() {
  load();
  
  if (!state.map[1][1] && !state.map[2][2]) {
    state.map[0][1] = { mine: false, shop: 'Bot Drip', shelves: [] };
    state.map[2][3] = { mine: false, shop: 'LV Corner', shelves: [] };
    state.map[4][4] = { mine: false, shop: 'Street Shop', shelves: [] };
    logMsg('Добро пожаловать в Block City! Купи блок и открой магазин.');
  }
  
  updateUI();
  setInterval(customerTick, 8000);
  setInterval(() => { state.day++; updateUI(); }, 60000);
}

init();
</script>
